<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conference Registration Form</title>
</head>
<body>
    <h1>Conference Registration Form</h1>

    <form>
        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" required>
        <br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age"
               min="18" max="99" required>
        <br><br>

        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label><br>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <br><br>

        <label for="country">Country of Residence:</label><br>
        <select id="country" name="country">
            <option value="">Select a country</option>
            <option value="Malaysia">Malaysia</option>
            <option value="Singapore">Singapore</option>
            <option value="Indonesia">Indonesia</option>
            <option value="Thailand">Thailand</option>
            <option value="Brunei">Brunei</option>
            <option value="Philippines">Philippines</option>
            <option value="Japan">Japan</option>
            <option value="Australia">Australia</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="United States">United States</option>
        </select>
        <br><br>

        <p>Areas of Interest:</p>
        <input type="checkbox" id="software" name="interest"
               value="Software Development">
        <label for="software">Software Development</label><br>

        <input type="checkbox" id="data" name="interest"
               value="Data Science">
        <label for="data">Data Science</label><br>

        <input type="checkbox" id="cyber" name="interest"
               value="Cybersecurity">
        <label for="cyber">Cybersecurity</label><br>

        <input type="checkbox" id="ai" name="interest"
               value="Artificial Intelligence">
        <label for="ai">Artificial Intelligence</label>
        <br><br>

        <p>Experience Level:</p>
        <input type="radio" id="beginner" name="experience"
               value="Beginner">
        <label for="beginner">Beginner</label><br>

        <input type="radio" id="intermediate" name="experience"
               value="Intermediate">
        <label for="intermediate">Intermediate</label><br>

        <input type="radio" id="advanced" name="experience"
               value="Advanced">
        <label for="advanced">Advanced</label>
        <br><br>

        <label for="comments">Comments or Questions:</label><br>
        <textarea id="comments" name="comments"
                  rows="5" cols="40">Any comments or questions?</textarea>
        <br><br>

        <button type="submit">Register</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
